<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;620;680;760&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:18px 20px;background:var(--paper)}.evt{display:grid;grid-template-columns:48px 92px 1fr 110px;gap:10px;align-items:center;min-height:36px;padding:6px 0;border-bottom:1px solid rgba(23,23,23,.07)}.t,.s{font-family:var(--mono);font-size:10px;color:var(--ink-3)}.s{text-align:right}.type{justify-self:start;border:1px solid rgba(23,23,23,.18);background:var(--paper);padding:2px 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}.sum{font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.evt.signal .type{border-color:#b3402f;color:#b3402f;background:rgba(179,64,47,.1)}.evt.signal .sum{color:#b3402f}</style></head><body><div class="evt"><span class="t">09:10</span><span class="type">communication</span><span class="sum">nursing_note → care_team</span><span class="s">rn · nursing_note</span></div><div class="evt signal"><span class="t">09:12</span><span class="type">intent</span><span class="sum">Clarify ventilation and perfusion after respiratory worsening</span><span class="s">md · order</span></div><div class="evt"><span class="t">09:14</span><span class="type">action</span><span class="sum">increase oxygen from 3L NC to 6L simple mask</span><span class="s">rn · procedure</span></div><div class="evt signal"><span class="t">09:30</span><span class="type">intent</span><span class="sum">Reassess oxygen response and work of breathing by 09:50</span><span class="s">rn_agent · care_plan</span></div></body></html>
