<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;620;680;760&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:18px 22px;background:var(--paper)}h2{margin:0 0 8px;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line);background:var(--card);font-family:var(--mono);font-size:14px}.icon.acc{border-color:#b3402f;color:#b3402f;background:rgba(179,64,47,.1)}.cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--hair);padding:3px 7px;background:var(--paper)}.tag.acc{border-color:#b3402f;color:#b3402f;background:rgba(179,64,47,.1)}.sq{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px}.sq i{width:10px;height:10px;display:inline-block}.amber{background:#bd7808}.red{background:#b3402f}.ink{background:#171717}.ok{background:#3d7c56}</style></head><body><div class="cap">unicode glyph icons (mono)</div><div class="row"><span class="icon">π</span><span class="icon">→</span><span class="icon">↑</span><span class="icon">↓</span><span class="icon acc">↻</span><span class="icon">Δ</span><span class="icon">●</span><span class="icon">○</span><span class="icon">■</span><span class="icon">·</span></div><div class="cap">tags as icons (the system's primary affordance)</div><div class="row"><span class="tag">PATIENT</span><span class="tag">VITALS</span><span class="tag acc">SIGNAL</span><span class="tag">EVENT</span><span class="tag">DRAFT</span></div><div class="cap">cycle-state squares</div><div class="row"><span class="sq"><i class="amber"></i>draft 3</span><span class="sq"><i class="red"></i>watcher 1</span><span class="sq"><i class="ink"></i>committed 1</span><span class="sq"><i class="ok"></i>resolved 0</span></div></body></html>
