<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;620;680;760&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:18px 20px;background:#ddd}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sw{border:1px solid var(--line);padding:10px}.chip{height:60px;border:1px solid var(--line);margin-bottom:8px}.lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.lbl b{color:var(--ink);font-weight:700}.use{margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--ink-2)}</style></head><body><div class="row"><div class="sw" style="background:var(--paper)"><div class="chip" style="background:var(--paper)"></div><div class="lbl"><b>--paper</b><span>#F2F0EB</span></div><div class="use">page background</div></div><div class="sw" style="background:var(--paper)"><div class="chip" style="background:var(--paper-2)"></div><div class="lbl"><b>--paper-2</b><span>#E7E3DC</span></div><div class="use">active nav · modebar</div></div><div class="sw" style="background:var(--paper)"><div class="chip" style="background:var(--card)"></div><div class="lbl"><b>--card</b><span>#FBFAF6</span></div><div class="use">panel surface</div></div></div></body></html>
