<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;620;680;760&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:20px 24px;background:var(--paper)}.r{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair)}.r:last-child{border:0}.spec{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}.k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}.stamp{display:inline-block;border:1px solid var(--line);padding:3px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.stamp.warn{border-color:#bd7808;color:#bd7808}.crumb{font-family:var(--mono);color:var(--ink-3);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.cite{font-family:var(--mono);font-size:10.5px;border-bottom:1px dotted var(--ink-4);color:var(--ink-3)}</style></head><body><div class="r"><div class="spec">.k / .tag</div><span class="k">PATIENT</span></div><div class="r"><div class="spec">.crumb</div><span class="crumb">pi-chart · v0.4 · cockpit</span></div><div class="r"><div class="spec">.stamp</div><span class="stamp">COCKPIT · V0.4</span></div><div class="r"><div class="spec">.stamp.warn</div><span class="stamp warn">4 AGENT DRAFTS PENDING</span></div><div class="r"><div class="spec">.cite</div><span class="cite">currentState()</span></div></div></body></html>
