<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;620;680;760&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:18px 20px;background:var(--paper)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sw{border:1px solid var(--line);background:var(--card);padding:10px}.chip{height:46px;border:1px solid var(--line);margin-bottom:8px}.lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.lbl b{color:var(--ink);font-weight:700}.use{margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--ink-2)}.role{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#b3402f"></div><div class="lbl"><b>--accent</b><span>#B3402F</span></div><div class="use" style="color:#b3402f"><span class="role">WATCHER · SIGNAL</span></div></div><div class="sw"><div class="chip" style="background:rgba(179,64,47,.1);border-color:#b3402f"></div><div class="lbl"><b>--accent-soft</b><span>10%</span></div><div class="use">draft band fill</div></div><div class="sw"><div class="chip" style="background:#bd7808"></div><div class="lbl"><b>--amber</b><span>#BD7808</span></div><div class="use" style="color:#bd7808"><span class="role">DRAFT</span></div></div><div class="sw"><div class="chip" style="background:#3d7c56"></div><div class="lbl"><b>--ok</b><span>#3D7C56</span></div><div class="use" style="color:#3d7c56"><span class="role">COMMITTED</span></div></div></div></body></html>
