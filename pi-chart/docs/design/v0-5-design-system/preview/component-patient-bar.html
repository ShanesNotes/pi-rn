<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;620;680;760&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#171717; --ink-2:#48443f; --ink-3:#85807a;
    --paper:#f2f0eb; --paper-2:#e9e5dc; --card:#fbfaf6;
    --line:#171717; --hair:rgba(23,23,23,.18);
    --accent:#b3402f; --accent-soft:rgba(179,64,47,.10);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter Tight",ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:18px 22px;
    background:
      radial-gradient(120% 80% at 0% 0%, #f6f3ec 0%, transparent 60%),
      var(--paper);
    font-family:var(--sans); color:var(--ink);
  }

  .bar{
    display:grid;
    grid-template-columns: 2.1fr 1fr 1fr;
    border:1px solid var(--line);
    background:var(--card);
  }
  .cell{
    padding:11px 14px;
    border-right:1px solid var(--hair);
    min-height:84px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .cell:last-child{border-right:0}

  .k{
    font-family:var(--mono);
    font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:5px;
  }

  /* primary cell: name + inline code icon */
  .name-row{
    display:flex; align-items:center; gap:10px;
  }
  .name{ font-size:19px; font-weight:680; letter-spacing:-.005em; }
  .name-row .meta{ font-family:var(--mono); font-size:11px; color:var(--ink-2); margin-top:0; }

  /* code-status tag — verbose label, not a glyph */
  .code-tag{
    display:inline-flex; align-items:center; justify-content:center;
    height:20px;
    padding:0 7px;
    border:1px solid var(--ink);
    background:var(--ink); color:var(--card);
    font-family:var(--mono); font-size:10px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; line-height:1;
    flex-shrink:0;
    cursor:default;
    white-space:nowrap;
  }
  .code-tag:hover{ outline:2px solid var(--accent-soft); outline-offset:1px; }
  /* DNR — outlined ink */
  .code-tag.dnr{ background:var(--card); color:var(--ink); }
  /* DNI — outlined accent (most aggressive limitation flag) */
  .code-tag.dni{ background:var(--card); color:var(--accent); border-color:var(--accent); }

  .meta{ font-family:var(--mono); font-size:11px; color:var(--ink-2); margin-top:4px; }
  .meta b{ color:var(--ink); font-weight:600 }

  /* secondary cell */
  .acu{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--accent); color:var(--accent);
    padding:3px 8px;
    font-family:var(--mono); font-size:10px; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .acu.watcher{ border-color:var(--accent); color:var(--accent); }

  /* constraints / allergy cell */
  .constraints{ display:flex; flex-direction:column; gap:3px; }
  .allergy{
    display:inline-block;
    font-family:var(--mono); font-size:10px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent);
    border-bottom:1px solid var(--accent);
    padding-bottom:1px;
    width:fit-content;
  }

  /* legend / icon key */
  .legend{
    margin-top:12px;
    border-top:1px dashed var(--hair);
    padding-top:10px;
    display:flex; gap:18px; flex-wrap:wrap;
    font-family:var(--mono); font-size:10px; color:var(--ink-3); letter-spacing:.04em;
  }
  .legend .item{ display:inline-flex; align-items:center; gap:6px; }
  .legend .item b{ color:var(--ink); font-weight:600; letter-spacing:.06em; }
  .legend .role{ color:var(--ink-3); letter-spacing:.04em; text-transform:none; }
</style>
</head>
<body>

  <div class="bar">
    <!-- primary: patient identity (now first), with code icon inline -->
    <div class="cell">
      <div class="k">patient</div>
      <div class="name-row">
        <span class="name">Smith, Linda</span>
        <span class="code-tag" title="Code status: FULL">FULL</span>
      </div>
      <div class="meta">Bed 12B · MRN 4471 · 58 F · CAP day 1</div>
    </div>

    <!-- secondary: acuity (no longer first / primary) -->
    <div class="cell">
      <div class="k">acuity</div>
      <span class="acu watcher"><span class="dot"></span>watcher</span>
      <div class="meta">SpO₂ 89 · RR 30</div>
    </div>

    <!-- tertiary: constraints / allergies -->
    <div class="cell">
      <div class="k">constraints</div>
      <div class="constraints">
        <span class="allergy">PCN allergy</span>
        <span class="meta">cefepime ok · iso: contact</span>
      </div>
    </div>
  </div>

  <div class="legend">
    <span class="item"><span class="code-tag">FULL</span><span class="role">full code</span></span>
    <span class="item"><span class="code-tag dnr">DNR</span><span class="role">do not resuscitate</span></span>
    <span class="item"><span class="code-tag dni">DNI</span><span class="role">do not intubate</span></span>
    <span class="item" style="opacity:.7">· hover for full directive</span>
  </div>

</body></html>
