<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;620;680;760&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:18px 20px;background:var(--paper)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sw{border:1px solid var(--line);background:var(--card);padding:10px}.chip{height:46px;border:1px solid var(--line);margin-bottom:8px}.lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}.lbl b{color:var(--ink);font-weight:700}.use{margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--ink-2)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#171717"></div><div class="lbl"><b>--ink</b><span>#171717</span></div><div class="use">text · 1px borders</div></div><div class="sw"><div class="chip" style="background:#48443f"></div><div class="lbl"><b>--ink-2</b><span>#48443F</span></div><div class="use">secondary text</div></div><div class="sw"><div class="chip" style="background:#85807a"></div><div class="lbl"><b>--ink-3</b><span>#85807A</span></div><div class="use">metadata · mono labels</div></div><div class="sw"><div class="chip" style="background:#c8c0b8"></div><div class="lbl"><b>--ink-4</b><span>#C8C0B8</span></div><div class="use">hairline · dotted underlines</div></div></div></body></html>
